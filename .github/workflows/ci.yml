# The checks AGENTS.md already requires before finishing a change, plus the
# ones that would have caught bugs this project has actually hit:
#
#   build   — the pure unit checks (section list, scoring, ADIF, Cabrillo),
#             then lint, typecheck and the production build (the AGENTS.md
#             gate), then the end-to-end API flow against the real server
#   schema  — schema idempotency, the SES exclusion constraint, the route-level
#             SQL, and the admin console's backup/restore round trip
#   shell   — syntax-checks the shell scripts, gates on shellcheck, and
#             verifies the two rig-bridge copies haven't drifted

name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  PGPASSWORD: postgres

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` fails loudly if the lockfile has drifted from package.json,
      # which is what we want in CI rather than silently resolving new versions.
      - run: npm ci

      # Pure source check — no build or database needed, so it runs first and
      # fails fast. Guards the ARRL/RAC section list against drifting between
      # the three places that enumerate it, and against a section total being
      # written out as a literal instead of derived from ARRL_SECTIONS.length.
      - name: Section list consistency
        run: node scripts/test-sections.cjs

      # The scoring formula decides the number a club submits to the ARRL, so
      # it gets asserted directly rather than only through the Cabrillo header
      # in the end-to-end suite. Compiles lib/scoring.ts with the project's own
      # tsc — no runner, no database, no server.
      - name: Scoring tests
        run: node scripts/test-scoring.cjs

      # ADIF and Cabrillo are what a log looks like once it leaves this app —
      # the file uploaded to LoTW and the one submitted to the ARRL. Both were
      # covered only by substring checks in the end-to-end suite, which can't
      # reach the shapes that actually go wrong (a Date where a string was
      # assumed, a null class on an SES, a hardcoded transmitter number).
      - name: Export format tests
        run: |
          node scripts/test-adif.cjs
          node scripts/test-cabrillo.cjs

      # The dashboard log view's filtering and column selection are pure
      # functions precisely so they can be asserted here rather than only
      # through a browser. The cases that matter are the ones where a wrong
      # answer hides a contact an operator is looking for.
      - name: Log view tests
        run: node scripts/test-log-filters.cjs

      # What the operating position picker shows before someone sits down. A
      # wrong answer sends an operator to a band another station is already
      # signing the callsign on, which is what the checkout exists to prevent.
      - name: Slot board tests
        run: node scripts/test-slot-board.cjs

      # Gated now that the react-hooks backlog is worked through. Anything it
      # reports is new.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Prepare database
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE ezfd LOGIN;"
          psql -h localhost -U postgres -c "CREATE DATABASE ezfd;"
          psql -h localhost -U postgres -d ezfd -v ON_ERROR_STOP=1 -q -f db/schema.sql

      # The standalone bundle doesn't include the static assets; the deploy
      # copies them alongside, so do the same here.
      - name: Start server
        run: |
          cp -r .next/static .next/standalone/.next/
          cd .next/standalone
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/ezfd \
          PORT=3000 HOSTNAME=127.0.0.1 node server.js > /tmp/server.log 2>&1 &

      - name: End-to-end API tests
        run: BASE_URL=http://127.0.0.1:3000 bash scripts/test-e2e.sh

      - name: Server log
        if: failure()
        run: cat /tmp/server.log || true

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # deploy.sh and ezfd-admin.sh both re-apply schema.sql on every update,
      # so applying it twice is the real-world case: it must be idempotent.
      - name: Apply schema twice
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE ezfd LOGIN;"
          psql -h localhost -U postgres -c "CREATE DATABASE ezfd;"
          psql -h localhost -U postgres -d ezfd -v ON_ERROR_STOP=1 -q -f db/schema.sql
          psql -h localhost -U postgres -d ezfd -v ON_ERROR_STOP=1 -q -f db/schema.sql

      # The SES one-signal-per-band-per-mode guarantee lives entirely in a
      # database constraint, so it needs a test that exercises the database.
      - name: SES constraint assertions
        run: psql -h localhost -U postgres -d ezfd -v ON_ERROR_STOP=1 -f db/test-ses-constraint.sql

      # Route SQL is built as strings, so the typechecker can't see a bad cast.
      - name: Route query tests
        run: DATABASE_URL=postgres://postgres:postgres@localhost:5432/ezfd node scripts/test-queries.cjs

      # This path has been wrong twice, both times silently.
      - name: Backup/restore round trip
        run: PSQL="psql -h localhost -U postgres" bash scripts/test-restore.sh

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # deploy.sh and ezfd-admin.sh are long, interactive, and otherwise
      # unvalidated — a syntax error would only surface on a live server.
      - name: Syntax-check shell scripts
        run: |
          for f in $(git ls-files '*.sh'); do
            echo "checking $f"
            bash -n "$f"
          done

      # public/ezfd-rig-bridge.py is a manual duplicate of the root copy,
      # served for direct browser download — they are deliberately not
      # symlinked (see AGENTS.md), so nothing but this check stops them
      # drifting after someone edits one and forgets the other.
      - name: Rig bridge copies are in sync
        run: |
          if ! diff -q ezfd-rig-bridge.py public/ezfd-rig-bridge.py >/dev/null; then
            echo "public/ezfd-rig-bridge.py has drifted from the root copy."
            echo "They are a manual duplicate — run: cp ezfd-rig-bridge.py public/"
            diff ezfd-rig-bridge.py public/ezfd-rig-bridge.py || true
            exit 1
          fi
          echo "rig bridge copies are identical"

      # Gated, at every severity. The backlog that kept this advisory is
      # cleared, so anything it reports now is new.
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck $(git ls-files '*.sh')
