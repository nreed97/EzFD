# Publishes the GitHub Pages site: a front page and every guide in docs/,
# rendered by scripts/build-site.cjs through the same renderMarkdown() the
# app's /docs route uses. Runs on every push to master, so the site follows
# the guides without anyone remembering to republish it.
#
# Needs Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# once. Pull requests build the site in ci.yml, which also fails on a broken
# link; this workflow only deploys.

name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push supersedes a queued one rather than
# cancelling a deploy halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build the site
        run: node scripts/build-site.cjs

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
