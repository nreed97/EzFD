# Weekly pull requests for dependency updates, so an advisory against Next.js
# or pg arrives as a PR to review rather than as a red audit step on someone
# else's change. Minor and patch updates are grouped to keep the volume to one
# PR a week; majors come on their own, since they are the ones that need
# reading.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The servers run the Node major in .nvmrc. Types from a newer major
      # describe APIs those servers do not have, so code using them typechecks
      # and then fails at runtime. Move this with .nvmrc, not ahead of it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The lint tooling eslint-config-next pulls in supports TypeScript below
      # 6.1 only, and 7 rejects how the unit suites call tsc. Lift this when a
      # Next.js release supports the new major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
