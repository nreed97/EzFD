# The field-server stack: EzFD and its database, on one machine, with no
# internet required at run time.
#
#   cp .env.example .env      # then edit the two passwords and the key
#   docker compose up -d
#
# Everything the stack needs is in two images and this file. That is the point:
# `deploy.sh` reaches for apt repositories and certbot at the moment you run
# it, which is fine on a VPS and impossible in a field. Here the network is
# needed once, to fetch the images, and never again.
#
# See docs/field-server.md for the whole workflow, including how to get the
# images onto a Pi without building on it.

name: ezfd

services:
  # postgres:16 rather than the alpine variant, because it is the image CI runs
  # the schema and the database suites against. The alpine one is smaller and
  # would probably be fine, but "probably fine" is not what you want holding
  # the only copy of a club's log, and a data directory is not portable between
  # the two anyway.
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -U postgres so this asks whether the server will answer *as a client*,
      # not merely whether the process exists.
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # One-shot, on every up. Creates the role and database if they are absent and
  # applies db/schema.sql, which is idempotent by construction and checked as
  # such by CI. The app is not allowed to start until this exits 0.
  db-init:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      EZFD_DB_PASSWORD: ${EZFD_DB_PASSWORD:?set EZFD_DB_PASSWORD in .env}
    volumes:
      - ./db:/schema:ro
      - ./docker/db-init.sh:/db-init.sh:ro
    entrypoint: ["bash", "/db-init.sh"]
    # Never restart: a failure here must stay visible and must stop the app
    # from coming up against a half-provisioned database.
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ezfd:local
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://ezfd:${EZFD_DB_PASSWORD:?set EZFD_DB_PASSWORD in .env}@db:5432/ezfd
      EZFD_ENCRYPTION_KEY: ${EZFD_ENCRYPTION_KEY:?set EZFD_ENCRYPTION_KEY in .env}
      # Blank means anyone who can reach the server can create an event, which
      # is the usual choice on a private field LAN.
      EZFD_ADMIN_KEY: ${EZFD_ADMIN_KEY:-}
    ports:
      # Port 80 by default so operators type a hostname and nothing else. There
      # is no TLS here and deliberately so: a field LAN has no public domain to
      # certify, and a self-signed certificate trains people to click through
      # warnings. See docs/field-server.md for what plain HTTP costs.
      - "${EZFD_PORT:-80}:3000"
    restart: unless-stopped

volumes:
  # Named, not a bind mount: the log is the thing you cannot re-create, and a
  # named volume survives `docker compose down` while a stray `rm -rf` in the
  # checkout does not reach it. `docker compose down -v` is the only thing here
  # that deletes a log, which is why the guide never tells you to run it.
  db-data:
